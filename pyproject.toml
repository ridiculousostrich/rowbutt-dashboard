[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rowbutt-dashboard"
version = "0.1.0"
description = "Distributed LLM cost monitoring — agent collects token + GPU metrics, aggregator computes costs"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1,<9.0",
    "httpx>=0.27,<1.0",
    "Flask>=3.0,<4.0",
    "psutil>=5.9,<7.0",
]

[project.scripts]
rowbutt = "cli.main:cli"

[tool.setuptools.packages.find]
include = ["agent*", "aggregator*", "cli*", "config*", "db*", "web*"]
